# 非 host 版本, 不使用本机代理
version: "3.3"
services:
  tusk-mongo:
    image: mongo:5.0.18
    container_name: tusk-mongo
    restart: always
    ports:
      - 27017:27017
    networks:
      - tusk
    environment:
      - MONGO_INITDB_ROOT_USERNAME=sunx
      - MONGO_INITDB_ROOT_PASSWORD=1234
    volumes:
      - ./database/data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 3s
      retries: 20
  tusk:
    container_name: tusk
    image: tusk:latest
    ports:
      - 3200:3200
    networks:
      - tusk
    depends_on:
      tusk-mongo:
        condition: service_healthy
      im-mobile-renderer:
        condition: service_healthy
      antd-renderer:
        condition: service_healthy
      tusk-pg:
        condition: service_healthy
    restart: always
    env_file:
      - .env
    environment:
      # DB
      - MONGODB_URI=mongodb://sunx:1234@tusk-mongo:27017/tusk?authSource=admin
      - PGVECTOR_CONNECTION_STRING=postgresql://sunx:1234@tusk-pg:5432/postgres
      - PORT=3200
  im-mobile-renderer:
    image: im-mobile-renderer:latest
    ports:
      - "3002:3002"
    networks:
      - tusk
    environment:
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3002/health"]
      interval: 10s
      timeout: 3s
      retries: 10
  antd-renderer:
    image: antd-renderer:latest
    ports:
      - "3012:3012"
    networks:
      - tusk
    environment:
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3012/health"]
      interval: 10s
      timeout: 3s
      retries: 10
  tusk-pg:
    image: pgvector/pgvector:0.8.0-pg15 # docker hub
    # image: registry.cn-hangzhou.aliyuncs.com/fastgpt/pgvector:v0.8.0-pg15 # 阿里云
    container_name: tusk-pg
    restart: always
    # ports: # 生产环境建议不要暴露
    #   - 5432:5432
    networks:
      - tusk
    environment:
      # 这里的配置只有首次运行生效。修改后，重启镜像是不会生效的。需要把持久化数据删除再重启，才有效果
      - POSTGRES_USER=sunx
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=postgres
    volumes:
      - ./tusk-pg/data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'aiproxy']
      interval: 5s
      timeout: 5s
      retries: 10
networks:
  tusk:
